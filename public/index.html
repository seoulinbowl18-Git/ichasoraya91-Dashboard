<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ichasoraya91</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Identitas ichasoraya91: konsol operasional toko rayon.
   Bingkai hijau, sidebar terang, kanvas kerja putih membulat.
   Aksen hijau untuk aksi dan progres, oranye untuk yang perlu perhatian.
   Huruf: Plus Jakarta Sans, satu keluarga, angka tabular. */
:root{color-scheme:light dark;
--frame1:light-dark(#2e9a52,#0d2616);--frame2:light-dark(#9bdc98,#1c4a2a);
--side:light-dark(#f1f6f0,#111612);
--ground:light-dark(#f1f6f0,#111612);
--surface:light-dark(#ffffff,#181e19);
--sunk:light-dark(#f5f8f4,#141915);
--ink:light-dark(#16201a,#e8eee9);
--ink2:light-dark(#566159,#a6b0a8);
--ink3:light-dark(#87918a,#76807a);
--rule:light-dark(#e3e9e2,#29312b);
--acc:light-dark(#1e8a4a,#5fd08a);--acc-bg:light-dark(#e5f4ea,#16301f);--acc-deep:light-dark(#13502e,#5fd08a);
--acc2:light-dark(#d9682a,#f3a25e);--acc2-bg:light-dark(#fdeee3,#38251a);
--peach:light-dark(#fff4ea,#271e16);
--ok:light-dark(#0f7a52,#4fc88f);--ok-bg:light-dark(#e3f3ea,#15301f);
--warn:light-dark(#a3640e,#e9b25a);--warn-bg:light-dark(#fbf0de,#33280f);
--bad:light-dark(#c2372f,#f08a82);--bad-bg:light-dark(#fbe7e5,#3a1c1a);
--r1:8px;--r2:12px;--r3:18px}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:72px}
body{margin:0;background:linear-gradient(140deg,var(--frame1),var(--frame2)) fixed;color:var(--ink);font:15px/1.55 "Plus Jakarta Sans",system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}

/* kerangka */
.app{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:calc(100vh - 24px);margin:12px;border-radius:26px;background:var(--side);box-shadow:0 30px 80px -30px rgba(8,60,28,.55)}
body.slim .app{grid-template-columns:72px minmax(0,1fr)}
.side{position:sticky;top:12px;height:calc(100vh - 24px);overflow:hidden;background:transparent;padding:18px 14px 14px;display:flex;flex-direction:column;gap:2px;scrollbar-width:thin}
.canvas{margin:8px 8px 8px 0;background:var(--surface);border-radius:20px;border:1px solid var(--rule);box-shadow:0 1px 3px rgba(10,40,20,.06);min-width:0}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;text-decoration:none}
.mark{width:34px;height:34px;flex:none;border-radius:var(--r2);background:var(--acc-deep);display:grid;place-items:center}
.mark svg{width:20px;height:20px}
.brand b{font-size:16px;font-weight:800;letter-spacing:-.01em}
.brand small{display:block;font-size:12px;color:var(--ink3);font-weight:500;margin-top:-2px}
.grp{font-size:12px;font-weight:600;color:var(--ink3);padding:14px 10px 6px}
.nav{flex:1 1 auto;min-height:0;overflow-y:auto;scrollbar-width:thin;margin:0 -6px;padding:0 6px}
.nav a{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:var(--r1);text-decoration:none;color:var(--ink2);font-weight:500;font-size:14px;min-height:38px;position:relative}
.nav a:hover{background:var(--sunk);color:var(--ink)}
.nav a.on{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(10,40,20,.08),0 0 0 1px var(--rule)}
.nav a.on svg{color:var(--acc)}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav .cnt{margin-left:auto;font-size:11px;font-weight:700;font-style:normal;color:var(--acc);background:var(--acc-bg);padding:1px 8px;border-radius:99px}
.nav .cnt.bad{color:#fff;background:var(--bad)}
.side-foot{margin-top:auto;padding-top:16px;display:flex;flex-direction:column;gap:8px}
.capcard{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:12px}
.capcard>div:first-child{display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px}.capcard>div:first-child b{font-size:13px}.capcard>div:first-child span{font-weight:800;color:var(--acc)}
.capcard .bar{border:0;height:6px}.capcard small{display:block;font-size:11px;color:var(--ink3);margin-top:6px}
.slimbtn{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 10px;border-radius:var(--r1);color:var(--ink3);cursor:pointer;font-size:13px;min-height:38px}
.slimbtn:hover{background:var(--sunk);color:var(--ink)}
.slimbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7}
body.slim .brand div,body.slim .grp,body.slim .nav span,body.slim .nav .cnt,body.slim .slimbtn span,body.slim .capcard,body.slim .mewho,body.slim .mebtn>svg{display:none}
body.slim .grp{display:block;height:10px;padding:0}
body.slim .nav a,body.slim .slimbtn,body.slim .brand{justify-content:center}
body.slim .slimbtn svg{transform:scaleX(-1)}

.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;height:64px;padding:0 clamp(16px,2.4vw,28px);background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid transparent;border-radius:20px 20px 0 0}
.top.scrolled{border-bottom-color:var(--rule)}
.burger{display:none;width:42px;height:42px;border:1px solid var(--rule);border-radius:var(--r2);background:var(--surface);place-items:center;cursor:pointer}
.search{display:flex;align-items:center;gap:10px;flex:1;max-width:440px;height:42px;padding:0 12px;border:1px solid var(--rule);border-radius:var(--r2);background:var(--surface);color:var(--ink3);cursor:pointer;text-align:left}
.search svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;flex:none}
.search span{flex:1;font-size:14px}
kbd{font:600 11px "Plus Jakarta Sans",sans-serif;border:1px solid var(--rule);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--ink3);background:var(--sunk)}
.sync{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);white-space:nowrap;margin-left:auto}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 50%,transparent);animation:pulse 2.4s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.me{position:relative}
.mebtn{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--rule);background:var(--surface);border-radius:14px;padding:8px;cursor:pointer;text-align:left}
.mebtn:hover{border-color:var(--ink3)}.mebtn>svg{width:16px;height:16px;flex:none;stroke:var(--ink3);fill:none;stroke-width:2;transform:rotate(180deg)}
.av{width:32px;height:32px;border-radius:50%;background:var(--acc2);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.mewho{flex:1;min-width:0}.mewho b,.mewho small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mewho b{font-size:13px;font-weight:700}.mewho small{font-size:11px;color:var(--ink3)}
.menu{position:absolute;left:0;right:0;bottom:calc(100% + 8px);background:var(--surface);border:1px solid var(--rule);border-radius:var(--r3);box-shadow:0 18px 40px -18px rgba(20,40,25,.35);padding:8px;display:none;z-index:5}
.menu.open{display:block}
.menu .who{padding:8px 10px 10px;border-bottom:1px solid var(--rule);margin-bottom:6px;font-size:13px;color:var(--ink2);overflow-wrap:anywhere}
.menu .who b{display:block;color:var(--ink);font-size:14px}
.menu a,.menu button{display:flex;width:100%;border:0;background:none;text-align:left;padding:9px 10px;border-radius:var(--r1);text-decoration:none;font-size:14px;cursor:pointer}
.menu a:hover,.menu button:hover{background:var(--sunk)}

main{padding:8px clamp(16px,2.4vw,28px) 40px;width:100%}
.ph{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:12px 0 22px}
.ph h1{margin:0;font-size:clamp(26px,3vw,32px);line-height:1.1;letter-spacing:-.02em;font-weight:800;text-wrap:balance}
.ph p{margin:6px 0 0;color:var(--ink2);max-width:64ch}
.ph .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--surface);padding:0 16px;border-radius:var(--r2);font-weight:600;font-size:14px;cursor:pointer;min-height:42px;white-space:nowrap;text-decoration:none}
.btn{transition:border-color .15s,background-color .15s,filter .15s,transform .08s;-webkit-tap-highlight-color:transparent;user-select:none}
.btn:hover:not(:disabled){border-color:var(--ink3)}
.btn:active:not(:disabled){transform:translateY(1px) scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.loading:disabled{opacity:.85;cursor:progress}
.btn.loading svg{display:none}
.spin{width:16px;height:16px;flex:none;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn.pri{background:var(--acc-deep);border-color:var(--acc-deep);color:light-dark(#fff,#0f1a12)}
.btn.pri:hover:not(:disabled){filter:brightness(1.15);border-color:var(--acc-deep)}
.btn.icon{padding:0;width:42px;justify-content:center}
.btn.del:hover:not(:disabled){color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--rule))}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px}

.panel{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r3);padding:20px;box-shadow:0 1px 2px rgba(10,40,20,.04)}
.panel h2{margin:0;font-size:16px;font-weight:700;letter-spacing:-.01em}
.panel .sub{margin:2px 0 14px;color:var(--ink3);font-size:13px}
.ph2{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.ph2 a{font-size:13px;font-weight:600;color:var(--acc);text-decoration:none;white-space:nowrap}
.grid{display:grid;gap:16px}
.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.c-7-5{grid-template-columns:minmax(0,7fr) minmax(0,5fr)}
.mt{margin-top:16px}

/* angka ringkas */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--rule);border-radius:var(--r3)}
.stat{padding:18px 20px;border-left:1px solid var(--rule)}
.stat:first-child{border-left:0}
.stat .l{font-size:13px;color:var(--ink2);font-weight:500}
.stat .v{font-size:clamp(24px,2.4vw,30px);font-weight:800;letter-spacing:-.02em;line-height:1.2;margin:4px 0 2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat .d{font-size:12px;color:var(--ink3)}
.up{color:var(--ok);font-weight:700}.dn{color:var(--bad);font-weight:700}
.spark{height:34px;margin-top:8px;position:relative}.spark svg{position:absolute;inset:0;width:100%;height:100%}


/* ringkasan: tab, kartu pesanan, kolom kanan */
.dash{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.dtool{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:16px}
.tabs{display:inline-flex;gap:2px;padding:4px;background:var(--sunk);border:1px solid var(--rule);border-radius:12px;flex-wrap:wrap}
.tab{border:0;background:none;padding:7px 12px;border-radius:9px;font:inherit;font-weight:600;font-size:13px;color:var(--ink2);cursor:pointer;display:inline-flex;gap:7px;align-items:center;min-height:34px;transition:background-color .15s,color .15s}
.tab:hover{color:var(--ink)}
.tab span{font-size:11px;font-weight:700;background:var(--rule);color:var(--ink2);padding:0 7px;border-radius:99px;line-height:18px}
.tab.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(10,40,20,.12)}.tab.on span{background:var(--acc);color:light-dark(#fff,#0f1a12)}
.dsearch{display:flex;gap:8px;flex-wrap:wrap}
.dsearch .field{min-height:42px;font-size:14px}.dsearch input{width:200px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.cards .empty{grid-column:1/-1}
.ocard{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;box-shadow:0 1px 2px rgba(20,40,25,.04);-webkit-tap-highlight-color:transparent}
.ocard:hover{transform:translateY(-2px);box-shadow:0 14px 26px -16px rgba(20,60,30,.4);border-color:color-mix(in srgb,var(--acc) 35%,var(--rule))}
.ocard:active{transform:scale(.985)}
.ocard.warm{background:var(--peach);border-color:color-mix(in srgb,var(--acc2) 28%,var(--rule))}
.oc-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;color:var(--ink3);font-weight:600}
.oc-top .chl{font-size:12px;color:var(--ink2)}
.oc-top svg{width:13px;height:13px;stroke:var(--acc);fill:none;stroke-width:2.4;vertical-align:-2px;margin-right:3px}
.ocard h3{margin:0;font-size:15px;font-weight:700;line-height:1.3;letter-spacing:-.01em}
.oc-sub{margin:2px 0 0;font-size:12px;color:var(--ink3)}
.oc-step{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3);margin-bottom:-4px}
.oc-prog{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden;box-shadow:inset 0 0 0 1px var(--rule)}.oc-prog i{display:block;height:100%;background:var(--acc);border-radius:99px}
.warm .oc-prog i{background:var(--acc2)}
.oc-foot{display:flex;justify-content:space-between;gap:8px;white-space:nowrap;font-size:12px;color:var(--ink2);border-top:1px dashed var(--rule);padding-top:10px;margin-top:auto}
.oc-foot b{color:var(--ink)}
.more{display:flex;justify-content:center;margin-top:16px}.more small{color:var(--ink3);font-weight:500}
.rail{display:flex;flex-direction:column;gap:12px;position:sticky;top:76px}
.wcard{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:16px;box-shadow:0 1px 2px rgba(10,40,20,.04)}
.wcard h2{margin:0;font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.wcard h2 a{font-size:12px;font-weight:600;color:var(--acc);text-decoration:none}
.wcard .sub{margin:2px 0 12px;font-size:12px;color:var(--ink3)}
.donut{display:flex;align-items:center;gap:16px}.donut svg{width:96px;height:96px;flex:none}
.kvs{display:grid;gap:8px;font-size:12px;color:var(--ink2)}.kvs b{display:block;font-size:20px;line-height:1.1;color:var(--ink);font-variant-numeric:tabular-nums}
.gauge svg{width:100%;height:auto;display:block;max-width:240px;margin:0 auto}
.leg{display:grid;gap:6px;font-size:13px;margin-top:8px}.leg div{display:flex;align-items:center;gap:8px}.leg i{width:8px;height:8px;border-radius:50%;flex:none}.leg b{margin-left:auto;font-variant-numeric:tabular-nums}
.hb .r{display:grid;grid-template-columns:72px minmax(0,1fr) 28px;gap:10px;align-items:center;font-size:13px;padding:4px 0}.hb .bar{height:6px;border:0}.hb b{text-align:right;font-variant-numeric:tabular-nums}
.wcard .list .row{padding:10px 0}.wcard .list .row .t b{font-size:13px}.wcard .list .row .t small{font-size:12px}

/* daftar */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--rule)}
.row:first-child{border-top:0;padding-top:0}
.row .t{flex:1}
.row .t b{display:block;font-size:14px;font-weight:600}
.row .t small{display:block;color:var(--ink3);font-size:13px}
.sev{width:8px;height:8px;border-radius:50%;flex:none}
.ico{width:36px;height:36px;border-radius:var(--r2);display:grid;place-items:center;flex:none;background:var(--sunk)}
.ico svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.desks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.desk{border:1px solid var(--rule);border-radius:var(--r2);padding:10px 12px;font-size:13px;background:var(--sunk)}
.desk b{display:block;font-size:14px}
.desk span{display:flex;align-items:center;gap:6px;color:var(--ink2);margin-top:2px}

.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.bad{background:var(--bad-bg);color:var(--bad)}.chip.acc{background:var(--acc-bg);color:var(--acc)}.chip.mul{background:var(--acc2-bg);color:var(--acc2)}
.chl{display:inline-flex;align-items:center;gap:8px;font-weight:600;white-space:nowrap}
.chl i{width:8px;height:8px;border-radius:2px}

/* tabel */
.tw{overflow-x:auto;border:1px solid var(--rule);border-radius:var(--r3);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;font-size:13px;color:var(--ink3);padding:12px 16px;border-bottom:1px solid var(--rule);white-space:nowrap;background:var(--sunk)}
td{padding:12px 16px;border-bottom:1px solid var(--rule);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:color-mix(in srgb,var(--sunk) 60%,transparent)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mono{font-variant-numeric:tabular-nums;letter-spacing:.01em;color:var(--ink2)}
.panel .tw{border:0;border-radius:0;margin:0 -20px -20px;border-top:1px solid var(--rule)}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.field{border:1px solid var(--rule);background:var(--surface);border-radius:var(--r2);padding:0 14px;min-height:44px;font-size:16px}
.toolbar .field{flex:1;min-width:200px}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;border:1px solid var(--rule)}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.bars .r{display:grid;grid-template-columns:140px minmax(0,1fr) 110px;gap:14px;align-items:center;padding:8px 0;font-size:14px}
.bars .r b{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.sw{position:relative;width:44px;height:26px;border-radius:99px;background:var(--rule);border:0;cursor:pointer;flex:none;transition:background-color .2s}
.sw:disabled{opacity:.6;cursor:progress}
.cell{transition:transform .08s}.cell:active{transform:scale(.97)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw.on{background:var(--acc)}.sw.on::after{left:21px}
.rack{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.cell{border-radius:var(--r2);padding:10px;font-size:12px;border:1px solid var(--rule);cursor:pointer;background:var(--sunk);text-align:left;min-height:84px;display:flex;flex-direction:column;gap:2px}
.cell b{font-size:14px}.cell.low{border-color:var(--bad);background:var(--bad-bg)}
.form{display:grid;gap:14px}.form label{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--ink2)}
.res{font-size:clamp(34px,4vw,46px);font-weight:800;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--rule);font-size:14px;color:var(--ink2)}
.kv b{color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.note{font-size:13px;color:var(--ink3);margin-top:12px}
.chk{width:20px;height:20px;accent-color:var(--acc);cursor:pointer}
.fig{position:relative;height:260px}.fig svg{position:absolute;inset:0;width:100%;height:100%}

<label>Kurs 1 CNY dalam rupiah<input class="field" type="number" id="k2" value="2250" inputmode="decimal"></label>
<label>Jumlah pcs<input class="field" type="number" id="k3" value="500" inputmode="numeric"></label>
<label>Ongkir dan jasa impor, total (Rp)<input class="field" type="number" id="k4" value="3500000" inputmode="numeric"></label>
<div class="grid c3" style="gap:10px"><label>Bea masuk %<input class="field" type="number" id="k5" value="25" inputmode="decimal"></label><label>PPN %<input class="field" type="number" id="k6" value="11" inputmode="decimal"></label><label>PPh %<input class="field" type="number" id="k7" value="10" inputmode="decimal"></label></div>
<label>Harga jual per pcs (Rp)<input class="field" type="number" id="k8" value="99000" inputmode="numeric"></label></form></div>
<div class="panel"><div style="color:var(--ink2);font-size:14px">Modal per pcs</div><div class="res" id="kr"></div><div id="kl" style="margin:6px 0 14px;font-weight:700"></div><div class="kv" id="kd"></div><p class="note">Persentase bea masuk dan pajak di sini hanya contoh. Cek tarif sesuai kode HS produkmu ke forwarder atau Bea Cukai.</p></div></div>`;

/* interaksi per halaman */
function bind(id){
  if(id==='ringkasan'){
    $('#refresh').onclick=e=>busy(e.currentTarget,async()=>{$('#synctxt').textContent='Memperbarui';await tunggu(700);if(D.on)await D.muat();
      $('#synctxt').textContent='Tersinkron';render();toast('Data hari ini sudah diperbarui')});
    $$('[data-tab]').forEach(b=>b.onclick=()=>{store.set('rt',b.dataset.tab);LIM=9;render()});
    $('#rq').oninput=e=>{store.set('rq',e.target.value);LIM=9;const pos=e.target.selectionStart;render();const n=$('#rq');n.focus();n.setSelectionRange(pos,pos)};
    $('#rs').onchange=e=>{store.set('rs',e.target.value);render()};
    const m=$('#more');if(m)m.onclick=()=>{LIM+=9;render()};
    $('#csv').onclick=ekspor;
    const buka=c=>{const o=ORD.find(x=>x.id===c.dataset.o);
      if(o.print)return toast(`Label pesanan ${o.id} sudah dicetak`,{label:'Lihat riwayat',fn:()=>location.hash='log-print'});
      store.set('pf',o.id);store.set('pc','');SEL.clear();SEL.add(o.id);location.hash='print-daily'};
    $$('[data-o]').forEach(c=>{c.onclick=()=>buka(c);c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();buka(c)}}})}
  if(id==='print-daily'){
    $('#pf').oninput=e=>{store.set('pf',e.target.value);const pos=e.target.selectionStart;render();const n=$('#pf');n.focus();n.setSelectionRange(pos,pos)};
    $$('[data-ch]').forEach(b=>b.onclick=()=>{store.set('pc',store.get('pc','')===b.dataset.ch?'':b.dataset.ch);render()});
    const clr=$('#clrf');if(clr)clr.onclick=()=>{store.set('pf','');store.set('pc','');render()};
    $('#app tbody').onclick=e=>{const tr=e.target.closest('[data-row]');if(!tr)return;const id=tr.dataset.row;
      const on=e.target.matches('[data-id]')?e.target.checked:!SEL.has(id);on?SEL.add(id):SEL.delete(id);syncSel()};
    const semua=()=>{const ids=$$('[data-id]').map(c=>c.dataset.id),allOn=ids.every(i=>SEL.has(i));ids.forEach(i=>allOn?SEL.delete(i):SEL.add(i));syncSel()};
    $('#selall').onclick=semua;$('#chkall').onchange=semua;
    $('#selclr').onclick=()=>{SEL.clear();syncSel()};
    const cetak=b=>busy(b,async()=>{const ids=[...SEL];if(!ids.length)return;const printer='Printer meja 1';
      if(D.on){try{D.c.log.push(await D.kirim('POST',{jenis:'cetak',nomor_pesanan:ids,printer}))}catch(e){return gagal(e)}}
      else{await tunggu(500);const L=store.get('log',LOG0);L.push({w:new Date().toTimeString().slice(0,5).replace(':','.'),u:window.__first||'Admin',n:ids.length,p:printer});store.set('log',L)}
      ORD.forEach(o=>{if(SEL.has(o.id))o.print=true});if(!D.on)store.set('printed',ORD.filter(o=>o.print).map(o=>o.id));
      SEL.clear();drawMenu();render();toast(ids.length+' label dicetak',{label:'Lihat riwayat',fn:()=>location.hash='log-print'})});
    $('#doprint').onclick=e=>cetak(e.currentTarget);$('#doprint2').onclick=e=>cetak(e.currentTarget);
    syncSel()}
  if(id==='sdcase')$$('[data-sw]').forEach(b=>b.onclick=async()=>{const k=b.dataset.sw,S={...D.get('sd',SD0)};S[k]=!S[k];
    if(D.on){b.disabled=true;try{D.c.sd=await D.kirim('PUT',{jenis:'aturan',nilai:S})}catch(e){return gagal(e)}finally{b.disabled=false}}else store.set('sd',S);
    b.classList.toggle('on',S[k]);b.setAttribute('aria-checked',S[k]);toast(S[k]?'Aturan dinyalakan':'Aturan dimatikan')});
  if(id==='task'){const T=()=>D.get('task',T0);
    $('#tf').onsubmit=async e=>{e.preventDefault();const v=$('#tin').value.trim();if(!v){$('#tin').focus();return toast('Tulis tugasnya dulu')}
      if(D.on){try{await busy(e.submitter,async()=>D.c.task.unshift(await D.kirim('POST',{jenis:'tugas',judul:v})))}catch(e){return gagal(e)}}else{const t=T();t.unshift({t:v,d:false});store.set('task',t)}
      render();$('#tin').focus()};
    $$('[data-t]').forEach(c=>c.onchange=async()=>{const t=T(),x=t[c.dataset.t];
      if(D.on){try{Object.assign(x,await D.kirim('PATCH',{jenis:'tugas',id:x.id,selesai:c.checked}))}catch(e){c.checked=!c.checked;return gagal(e)}}else{x.d=c.checked;store.set('task',t)}
      render()});
    $$('[data-del]').forEach(b=>b.onclick=async()=>{const t=T(),i=+b.dataset.del,x=t[i];
      if(D.on){try{await busy(b,()=>D.kirim('DELETE',{jenis:'tugas',id:x.id}))}catch(e){return gagal(e)}}
      t.splice(i,1);if(!D.on)store.set('task',t);render();
      toast('Tugas dihapus',{label:'Urungkan',fn:async()=>{
        if(D.on){try{let r=await D.kirim('POST',{jenis:'tugas',judul:x.t});if(x.d)r=await D.kirim('PATCH',{jenis:'tugas',id:r.id,selesai:true});T().splice(i,0,r)}catch(e){return gagal(e)}}
        else{const t2=T();t2.splice(i,0,x);store.set('task',t2)}
        if(location.hash.slice(1)==='task')render();toast('Tugas dikembalikan')}})})}
  if(id==='rak-produk'){$$('[data-cell]').forEach(b=>b.onclick=()=>{const[r,p,q]=b.dataset.cell.split('|');$('#rinfo').textContent=`Rak ${r} berisi ${p}, sisa ${q} pcs.`});
    $('#rf').oninput=e=>{const v=e.target.value.toLowerCase();$$('[data-cell]').forEach(b=>b.style.opacity=!v||b.dataset.cell.toLowerCase().includes(v)?1:.25)}}
  if(id==='masalah-produk')$('#mf').onsubmit=async e=>{e.preventDefault();const m=$('#mp2').value.trim();if(!m)return toast('Tulis masalahnya dulu');
    const L={p:$('#mp1').value,m,c:$('#mp3').value};
    if(D.on){try{await busy(e.submitter,async()=>D.c.mp.push(await D.kirim('POST',{jenis:'masalah',produk:L.p,masalah:m,channel:L.c})))}catch(e){return gagal(e)}}
    else{const M=store.get('mp',MP0);M.push({...L,s:'Baru'});store.set('mp',M)}
    toast('Laporan terkirim');render()};
  if(id==='masalah-produk')$$('[data-ms]').forEach(b=>b.onclick=async()=>{const M=D.get('mp',MP0),x=M[b.dataset.ms],nx=x.s==='Baru'?'Diproses':'Selesai';
    if(D.on){try{await busy(b,async()=>Object.assign(x,await D.kirim('PATCH',{jenis:'masalah',id:x.id,status:nx})))}catch(e){return gagal(e)}}
    else{x.s=nx;store.set('mp',M)}
    render();toast(nx==='Selesai'?'Masalah ditandai selesai':'Masalah sedang diproses')});
  if(id==='kalkulator-impor'){const calc=()=>{const v=k=>+$('#k'+k).value||0;const barang=v(1)*v(2)*v(3),cif=barang+v(4),bea=cif*v(5)/100,ppn=(cif+bea)*v(6)/100,pph=(cif+bea)*v(7)/100,tot=cif+bea+ppn+pph,per=v(3)?tot/v(3):0,laba=v(8)-per,mg=v(8)?Math.round(laba/v(8)*100):0;
    $('#kr').textContent=rp(per);$('#kl').innerHTML=`<span style="color:${laba>=0?'var(--ok)':'var(--bad)'}">Laba ${rp(laba)} per pcs, margin ${mg}%</span>`;
    $('#kd').innerHTML=[['Harga barang',barang],['Ongkir dan jasa',v(4)],['Bea masuk',bea],['PPN',ppn],['PPh',pph],['Total modal',tot]].map(x=>`<div>${x[0]}<b>${rp(x[1])}</b></div>`).join('')};
    $('#kf').oninput=calc;calc()}
  if(id==='wh-report'){const s=$('#whchart');const inn=[420,380,510,300,460,620,540],out=[610,580,700,640,720,880,904];
    const draw=()=>{const W=s.clientWidth,H=s.clientHeight,pl=40,pb=26,mx=1000,bw=(W-pl)/7,narrow=W<520;let g='';
      [0,250,500,750,1000].forEach(t=>{const y=H-pb-(H-pb-10)*t/mx;g+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--rule)"/>`+(narrow&&t%500?'':`<text x="${pl-8}" y="${y+4}" font-size="11" text-anchor="end" fill="var(--ink3)">${t}</text>`)});
      for(let i=0;i<7;i++){const d=new Date(Date.now()-(6-i)*864e5),x=pl+i*bw+bw*.2,w=bw*.28;[[out[i],'var(--acc)',0],[inn[i],'var(--acc2)',w+3]].forEach(([v,c,o])=>{const h=(H-pb-10)*v/mx;g+=`<rect x="${x+o}" y="${H-pb-h}" width="${w}" height="${h}" rx="3" fill="${c}"><title>${v} pcs</title></rect>`});g+=`<text x="${pl+i*bw+bw/2}" y="${H-6}" font-size="11" text-anchor="middle" fill="var(--ink3)">${narrow?d.getDate():d.toLocaleDateString('id-ID',{day:'numeric',month:'short'})}</text>`}s.innerHTML=g};
    const ro=new ResizeObserver(draw);ro.observe(s)}
}

/* router */
function render(){
  const id=location.hash.slice(1)||'ringkasan';const page=V[id]?id:'ringkasan';drawMenu();
  $('#app').innerHTML=V[page]();
  $$('#menu a').forEach(a=>{const on=a.dataset.p===page;a.classList.toggle('on',on);on?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current')});
  document.body.classList.remove('nav','hassel');bind(page);
  const p=PAGES.find(x=>x[0]===page);document.title=(p?p[1]+' · ':'')+'ichasoraya91';
}

/* palet perintah */
let sel=0;
const palList=q=>{const r=PAGES.filter(p=>(p[1]+' '+p[3]).toLowerCase().includes(q.toLowerCase()));sel=Math.min(sel,Math.max(0,r.length-1));
  $('#pallist').innerHTML=r.map((p,i)=>`<li><a href="#${p[0]}" class="${i===sel?'sel':''}">${svg(p[2])}${p[1]}<small>${p[3]}</small></a></li>`).join('')||'<li class="empty">Menu tidak ditemukan.</li>';return r};
const openPal=()=>{$('#pal').classList.add('open');$('#palin').value='';sel=0;palList('');$('#palin').focus()};
const closePal=()=>$('#pal').classList.remove('open');
$('#openpal').onclick=openPal;
$('#palin').oninput=e=>{sel=0;palList(e.target.value)};
$('#palin').onkeydown=e=>{const r=palList($('#palin').value);if(e.key==='ArrowDown'){sel=Math.min(r.length-1,sel+1);palList($('#palin').value);e.preventDefault()}if(e.key==='ArrowUp'){sel=Math.max(0,sel-1);palList($('#palin').value);e.preventDefault()}if(e.key==='Enter'&&r[sel]){location.hash=r[sel][0];closePal()}if(e.key==='Escape')closePal()};
$('#pal').onclick=e=>{if(e.target.id==='pal'||e.target.closest('a'))closePal()};
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPal()}if(e.key==='Escape'){closePal();$('#memenu').classList.remove('open')}});

/* akun, tema, menu */
const mb=$('#mebtn'),mm=$('#memenu');
mb.onclick=e=>{e.stopPropagation();const o=mm.classList.toggle('open');mb.setAttribute('aria-expanded',o)};
document.addEventListener('click',e=>{if(!e.target.closest('.me'))mm.classList.remove('open')});
const applyTheme=t=>{document.documentElement.dataset.theme=t||'light';const b=document.getElementById('theme');if(b)b.textContent=t==='dark'?'Ganti ke tema terang':'Ganti ke tema gelap'};
applyTheme(store.get('theme','light'));
$('#theme').onclick=()=>{const cur=document.documentElement.dataset.theme||'light';const nx=cur==='dark'?'light':'dark';applyTheme(nx);store.set('theme',nx);render()};
if(store.get('slim',false))document.body.classList.add('slim');
$('#slim').onclick=()=>{const s=document.body.classList.toggle('slim');store.set('slim',s);$('#slim').setAttribute('aria-label',s?'Lebarkan menu':'Ciutkan menu')};
$('#burger').onclick=()=>document.body.classList.toggle('nav');
$('#scrim').onclick=()=>document.body.classList.remove('nav');
window.addEventListener('scroll',()=>$('#top').classList.toggle('scrolled',scrollY>4),{passive:true});
window.addEventListener('hashchange',()=>{render();scrollTo(0,0)});

drawMenu();render();
D.muat().then(ok=>{if(!ok)return;ORD.forEach(o=>o.print=o.print0||D.c.printed.includes(o.id));drawMenu();render()});
fetch('/api/auth/me').then(r=>r.ok?r.json():null).then(u=>{if(!u)return;
  const first=(u.name||u.email.split('@')[0]).split(' ')[0];window.__first=first;
  $('#uname').textContent=u.name||first;$('#umail').textContent=u.email;$('#mname').textContent=u.name||first;$('#memail').textContent=u.email;
  const a=$('#uav');if(u.picture)a.innerHTML=`<img src="${esc(u.picture)}" alt="" referrerpolicy="no-referrer">`;else a.textContent=first[0].toUpperCase();
  if((location.hash.slice(1)||'ringkasan')==='ringkasan')render()}).catch(()=>{});
}
</script>
