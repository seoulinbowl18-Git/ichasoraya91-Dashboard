<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ichasoraya91</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Identitas ichasoraya91: konsol operasional toko rayon.
   Warna dari pewarna kain: nila (indigo) dan mulberry, di atas putih kapas.
   Elemen khas: pita ukur penjahit untuk alur pesanan hari ini.
   Huruf: Plus Jakarta Sans, satu keluarga, angka tabular. */
:root{color-scheme:light dark;
--ground:light-dark(#f3f3f1,#121216);
--surface:light-dark(#ffffff,#1b1b21);
--sunk:light-dark(#f7f7f5,#16161b);
--ink:light-dark(#1d1b22,#ecebf0);
--ink2:light-dark(#5c5a66,#a9a7b4);
--ink3:light-dark(#8b8996,#77758a);
--rule:light-dark(#e4e3e0,#2a2a32);
--nila:light-dark(#2f3e7a,#8d9be0);
--nila-bg:light-dark(#eceef7,#20253d);
--mulberry:light-dark(#8e2a5b,#e07aab);
--mulberry-bg:light-dark(#f6e9ef,#3a1f2d);
--ok:light-dark(#0f7a62,#4fc8a4);--ok-bg:light-dark(#e3f3ee,#15302a);
--warn:light-dark(#a3640e,#e9b25a);--warn-bg:light-dark(#fbf0de,#33280f);
--bad:light-dark(#b63a33,#f08a82);--bad-bg:light-dark(#fbe7e5,#3a1c1a);
--tape:light-dark(#f2d98a,#4a3f1e);--tape-ink:light-dark(#5b4a12,#e8d494);
--r1:6px;--r2:10px;--r3:14px}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:72px}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.55 "Plus Jakarta Sans",system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--nila);outline-offset:2px;border-radius:4px}

/* kerangka */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
body.slim .app{grid-template-columns:72px minmax(0,1fr)}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--rule);padding:16px 12px 24px;display:flex;flex-direction:column;gap:2px;scrollbar-width:thin}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;text-decoration:none}
.mark{width:34px;height:34px;flex:none;border-radius:var(--r2);background:#2f3e7a;display:grid;place-items:center}
.mark svg{width:20px;height:20px}
.brand b{font-size:16px;font-weight:800;letter-spacing:-.01em}
.brand small{display:block;font-size:12px;color:var(--ink3);font-weight:500;margin-top:-2px}
.grp{font-size:12px;font-weight:600;color:var(--ink3);padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:var(--r1);text-decoration:none;color:var(--ink2);font-weight:500;font-size:14px;min-height:38px;position:relative}
.nav a:hover{background:var(--sunk);color:var(--ink)}
.nav a.on{background:var(--nila-bg);color:var(--nila);font-weight:700}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav .cnt{margin-left:auto;font-size:12px;font-weight:700;color:var(--mulberry);background:var(--mulberry-bg);padding:1px 7px;border-radius:99px}
.side-foot{margin-top:auto;padding-top:16px}
.slimbtn{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 10px;border-radius:var(--r1);color:var(--ink3);cursor:pointer;font-size:13px;min-height:38px}
.slimbtn:hover{background:var(--sunk);color:var(--ink)}
.slimbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7}
body.slim .brand div,body.slim .grp,body.slim .nav span,body.slim .nav .cnt,body.slim .slimbtn span{display:none}
body.slim .grp{display:block;height:10px;padding:0}
body.slim .nav a,body.slim .slimbtn,body.slim .brand{justify-content:center}
body.slim .slimbtn svg{transform:scaleX(-1)}

.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;height:64px;padding:0 clamp(16px,3vw,36px);background:color-mix(in srgb,var(--ground) 86%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid transparent}
.top.scrolled{border-bottom-color:var(--rule)}
.burger{display:none;width:42px;height:42px;border:1px solid var(--rule);border-radius:var(--r2);background:var(--surface);place-items:center;cursor:pointer}
.search{display:flex;align-items:center;gap:10px;flex:1;max-width:440px;height:42px;padding:0 12px;border:1px solid var(--rule);border-radius:var(--r2);background:var(--surface);color:var(--ink3);cursor:pointer;text-align:left}
.search svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;flex:none}
.search span{flex:1;font-size:14px}
kbd{font:600 11px "Plus Jakarta Sans",sans-serif;border:1px solid var(--rule);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--ink3);background:var(--sunk)}
.sync{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);white-space:nowrap;margin-left:auto}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 50%,transparent);animation:pulse 2.4s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.me{position:relative}
.mebtn{display:flex;align-items:center;gap:10px;border:1px solid var(--rule);background:var(--surface);border-radius:99px;padding:4px 12px 4px 4px;cursor:pointer;min-height:42px}
.av{width:32px;height:32px;border-radius:50%;background:var(--mulberry);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.mebtn b{font-size:13px;font-weight:600;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu{position:absolute;right:0;top:calc(100% + 8px);width:240px;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r3);box-shadow:0 18px 40px -18px rgba(20,20,40,.35);padding:8px;display:none}
.menu.open{display:block}
.menu .who{padding:8px 10px 10px;border-bottom:1px solid var(--rule);margin-bottom:6px;font-size:13px;color:var(--ink2);overflow-wrap:anywhere}
.menu .who b{display:block;color:var(--ink);font-size:14px}
.menu a,.menu button{display:flex;width:100%;border:0;background:none;text-align:left;padding:9px 10px;border-radius:var(--r1);text-decoration:none;font-size:14px;cursor:pointer}
.menu a:hover,.menu button:hover{background:var(--sunk)}

main{padding:8px clamp(16px,3vw,36px) 64px;max-width:1320px;width:100%}
.ph{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:12px 0 22px}
.ph h1{margin:0;font-size:clamp(26px,3vw,32px);line-height:1.1;letter-spacing:-.02em;font-weight:800;text-wrap:balance}
.ph p{margin:6px 0 0;color:var(--ink2);max-width:64ch}
.ph .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--surface);padding:0 16px;border-radius:var(--r2);font-weight:600;font-size:14px;cursor:pointer;min-height:42px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--nila);border-color:var(--nila);color:light-dark(#fff,#121216)}
.btn.pri:hover{filter:brightness(1.08)}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px}

.panel{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r3);padding:20px}
.panel h2{margin:0;font-size:16px;font-weight:700;letter-spacing:-.01em}
.panel .sub{margin:2px 0 14px;color:var(--ink3);font-size:13px}
.ph2{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.ph2 a{font-size:13px;font-weight:600;color:var(--nila);text-decoration:none;white-space:nowrap}
.grid{display:grid;gap:16px}
.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.c-7-5{grid-template-columns:minmax(0,7fr) minmax(0,5fr)}
.mt{margin-top:16px}

/* angka ringkas */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--rule);border-radius:var(--r3)}
.stat{padding:18px 20px;border-left:1px solid var(--rule)}
.stat:first-child{border-left:0}
.stat .l{font-size:13px;color:var(--ink2);font-weight:500}
.stat .v{font-size:clamp(24px,2.4vw,30px);font-weight:800;letter-spacing:-.02em;line-height:1.2;margin:4px 0 2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat .d{font-size:12px;color:var(--ink3)}
.up{color:var(--ok);font-weight:700}.dn{color:var(--bad);font-weight:700}
.spark{height:34px;margin-top:8px;position:relative}.spark svg{position:absolute;inset:0;width:100%;height:100%}

/* pita ukur: elemen khas */
.tapewrap{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r3);padding:22px 22px 18px;margin-bottom:16px}
.tapehead{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:18px}
.total{font-size:clamp(48px,6vw,72px);font-weight:800;line-height:.95;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.total-l{font-size:14px;color:var(--ink2);margin-top:6px}
.legend{display:flex;gap:6px 18px;flex-wrap:wrap;margin-left:auto}
.legend div{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2)}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend b{color:var(--ink);font-variant-numeric:tabular-nums}
.tape{position:relative;height:74px;border-radius:var(--r1);background:var(--tape);overflow:hidden;box-shadow:inset 0 -1px 0 rgba(0,0,0,.08)}
.tape .fill{position:absolute;inset:0;display:flex}
.tape .fill span{height:100%;transform-origin:left;animation:grow .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}}
@media(prefers-reduced-motion:reduce){.tape .fill span,.pulse{animation:none}}
.ticks{position:absolute;inset:0;pointer-events:none}
.ticks svg{width:100%;height:100%;display:block}
.cap{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--mulberry)}
.scale{position:relative;height:18px;margin-top:6px}.scale svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.tapefoot{display:flex;justify-content:space-between;gap:12px;margin-top:10px;font-size:13px;color:var(--ink2);flex-wrap:wrap}
.tapefoot b{color:var(--ink)}

/* daftar */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--rule)}
.row:first-child{border-top:0;padding-top:0}
.row .t{flex:1}
.row .t b{display:block;font-size:14px;font-weight:600}
.row .t small{display:block;color:var(--ink3);font-size:13px}
.sev{width:8px;height:8px;border-radius:50%;flex:none}
.ico{width:36px;height:36px;border-radius:var(--r2);display:grid;place-items:center;flex:none;background:var(--sunk)}
.ico svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.desks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.desk{border:1px solid var(--rule);border-radius:var(--r2);padding:10px 12px;font-size:13px;background:var(--sunk)}
.desk b{display:block;font-size:14px}
.desk span{display:flex;align-items:center;gap:6px;color:var(--ink2);margin-top:2px}

.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.bad{background:var(--bad-bg);color:var(--bad)}.chip.nila{background:var(--nila-bg);color:var(--nila)}.chip.mul{background:var(--mulberry-bg);color:var(--mulberry)}
.chl{display:inline-flex;align-items:center;gap:8px;font-weight:600;white-space:nowrap}
.chl i{width:8px;height:8px;border-radius:2px}

/* tabel */
.tw{overflow-x:auto;border:1px solid var(--rule);border-radius:var(--r3);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;font-size:13px;color:var(--ink3);padding:12px 16px;border-bottom:1px solid var(--rule);white-space:nowrap;background:var(--sunk)}
td{padding:12px 16px;border-bottom:1px solid var(--rule);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:color-mix(in srgb,var(--sunk) 60%,transparent)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mono{font-variant-numeric:tabular-nums;letter-spacing:.01em;color:var(--ink2)}
.panel .tw{border:0;border-radius:0;margin:0 -20px -20px;border-top:1px solid var(--rule)}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.field{border:1px solid var(--rule);background:var(--surface);border-radius:var(--r2);padding:0 14px;min-height:44px;font-size:16px}
.toolbar .field{flex:1;min-width:200px}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;border:1px solid var(--rule)}
.bar i{display:block;height:100%;background:var(--nila);border-radius:99px}
.bars .r{display:grid;grid-template-columns:140px minmax(0,1fr) 110px;gap:14px;align-items:center;padding:8px 0;font-size:14px}
.bars .r b{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.sw{position:relative;width:44px;height:26px;border-radius:99px;background:var(--rule);border:0;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw.on{background:var(--nila)}.sw.on::after{left:21px}
.rack{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.cell{border-radius:var(--r2);padding:10px;font-size:12px;border:1px solid var(--rule);cursor:pointer;background:var(--sunk);text-align:left;min-height:84px;display:flex;flex-direction:column;gap:2px}
.cell b{font-size:14px}.cell.low{border-color:var(--bad);background:var(--bad-bg)}
.form{display:grid;gap:14px}.form label{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--ink2)}
.res{font-size:clamp(34px,4vw,46px);font-weight:800;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--rule);font-size:14px;color:var(--ink2)}
.kv b{color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.note{font-size:13px;color:var(--ink3);margin-top:12px}
.chk{width:20px;height:20px;accent-color:var(--nila);cursor:pointer}
.fig{position:relative;height:260px}.fig svg{position:absolute;inset:0;width:100%;height:100%}
.steps{counter-reset:s;display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:40px minmax(0,1fr);gap:14px;padding:14px 0;border-top:1px solid var(--rule)}
.step:first-child{border:0}
.step::before{counter-increment:s;content:counter(s);width:32px;height:32px;border-radius:50%;background:var(--nila-bg);color:var(--nila);font-weight:800;display:grid;place-items:center}
.step b{display:block}.step small{color:var(--ink2);font-size:14px}
.empty{text-align:center;color:var(--ink3);padding:36px 16px}

/* palet perintah */
.pal{position:fixed;inset:0;z-index:60;background:rgba(15,15,25,.4);display:none;align-items:flex-start;justify-content:center;padding:12vh 16px 16px}
.pal.open{display:flex}
.pal-box{width:100%;max-width:520px;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r3);box-shadow:0 30px 60px -20px rgba(10,10,30,.5);overflow:hidden}
.pal input{width:100%;border:0;border-bottom:1px solid var(--rule);padding:16px 18px;font-size:16px;background:none;outline:none}
.pal ul{list-style:none;margin:0;padding:6px;max-height:50vh;overflow-y:auto}
.pal li a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r1);text-decoration:none;font-size:14px}
.pal li a svg{width:18px;height:18px;stroke:var(--ink3);fill:none;stroke-width:1.7}
.pal li a small{margin-left:auto;color:var(--ink3);font-size:12px}
.pal li a.sel{background:var(--nila-bg);color:var(--nila)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,90px);background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:var(--r2);font-weight:600;font-size:14px;transition:transform .25s;z-index:70}
.toast.on{transform:translate(-50%,0)}
.scrim{display:none}

@media(max-width:1180px){.c4,.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat:nth-child(3){border-left:0}.stat:nth-child(n+3){border-top:1px solid var(--rule)}.c-7-5{grid-template-columns:1fr}}
@media(max-width:900px){.app,body.slim .app{grid-template-columns:1fr}
.side{position:fixed;left:0;top:0;width:272px;z-index:50;transform:translateX(-102%);transition:transform .25s;box-shadow:20px 0 40px -20px rgba(0,0,0,.3)}
body.nav .side{transform:none}body.nav .scrim{display:block;position:fixed;inset:0;background:rgba(15,15,25,.4);z-index:45}
body.slim .brand div,body.slim .grp,body.slim .nav span,body.slim .nav .cnt{display:revert}
.burger{display:grid}.slimbtn{display:none}.sync span,.mebtn b,.search kbd{display:none}.mebtn{padding:4px}
.c3,.c2{grid-template-columns:1fr}.rack{grid-template-columns:repeat(3,minmax(0,1fr))}.desks{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}.stat{padding:14px}.legend{margin-left:0}.tape{height:60px}
.bars .r{grid-template-columns:96px minmax(0,1fr) 90px;gap:10px}.ph .act{margin-left:0}
table{font-size:14px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--rule)}.stack tr:last-child{border:0}.stack td{display:flow-root;border:0;padding:4px 16px;padding-inline-start:9em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:8em;margin-inline-start:-8em;white-space:normal;color:var(--ink3);font-size:13px}.stack td:empty{display:none}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="Menu utama">
    <a class="brand" href="#ringkasan">
      <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M4 7c3-3 5 3 8 0s5 3 8 0M4 12c3-3 5 3 8 0s5 3 8 0M4 17c3-3 5 3 8 0s5 3 8 0"/></svg></span>
      <div><b>ichasoraya91</b><small>Konsol operasional</small></div>
    </a>
    <nav class="nav" id="menu"></nav>
    <div class="side-foot"><button class="slimbtn" id="slim" aria-label="Ciutkan menu"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg><span>Ciutkan menu</span></button></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div>
    <header class="top" id="top">
      <button class="burger" id="burger" aria-label="Buka menu"><svg width="18" height="18" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <button class="search" id="openpal"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span>Cari menu atau pesanan</span><kbd>Ctrl K</kbd></button>
      <div class="sync"><i class="pulse"></i><span id="synctxt">Tersinkron</span></div>
      <div class="me">
        <button class="mebtn" id="mebtn" aria-haspopup="true" aria-expanded="false"><span class="av" id="uav">i</span><b id="uname">Akun</b></button>

<div class="panel"><h2>Masuk dan keluar per hari</h2><p class="sub"><span class="chl"><i style="background:var(--nila)"></i>Keluar</span> &nbsp; <span class="chl"><i style="background:var(--mulberry)"></i>Masuk</span></p><div class="fig"><svg id="whchart"></svg></div></div>`+SAMPLE;

V['task']=()=>{const T=D.get('task',T0);const open=T.filter(x=>!x.d).length;
return head('Tugas',open?`${open} tugas belum selesai.`:'Semua tugas selesai.')+`<div class="panel" style="max-width:820px"><form id="tf" class="toolbar"><input class="field" id="tin" placeholder="Tulis tugas baru" aria-label="Tugas baru"><button class="btn pri">Tambah tugas</button></form><div class="list">${T.map((x,i)=>`<div class="row"><input type="checkbox" class="chk" data-t="${i}" ${x.d?'checked':''} aria-label="Tandai selesai"><div class="t" style="${x.d?'text-decoration:line-through;color:var(--ink3)':''}">${esc(x.t)}</div><button class="btn sm" data-del="${i}">Hapus</button></div>`).join('')||'<p class="empty">Belum ada tugas. Tulis tugas pertama di atas.</p>'}</div></div>`};

const RACK=Array.from({length:24},(_,i)=>({r:'ABCD'[Math.floor(i/6)]+(i%6+1),p:PROD[i%PROD.length],q:(i*37+11)%120}));
V['rak-produk']=()=>head('Rak produk','Lokasi produk di gudang. Ketuk rak untuk melihat isinya.')+`<div class="panel"><div class="toolbar"><input class="field" id="rf" placeholder="Cari produk di rak" aria-label="Cari produk"></div><div class="rack">${RACK.map(c=>`<button class="cell ${c.q<20?'low':''}" data-cell="${c.r}|${c.p}|${c.q}"><b>${c.r}</b>${c.p}<span style="color:${c.q<20?'var(--bad)':'var(--ink3)'};margin-top:auto">${c.q} pcs</span></button>`).join('')}</div><p class="note" id="rinfo">Rak bertanda merah berisi kurang dari 20 pcs.</p></div>`;

V['operasional']=()=>{const S=[['Rina','Packer','07.52','Hadir'],['Dewi','Packer','07.58','Hadir'],['Sari','Packer','08.01','Hadir'],['Lina','Packer','08.20','Terlambat'],['Tika','QC','07.45','Hadir'],['Ayu','Admin CS','','Izin'],['Budi','Kurir internal','08.05','Hadir']];
return head('Absensi tim','Kehadiran shift pagi, 08.00 sampai 16.00.')+`<div class="stats" style="grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:16px">${stat('Hadir',S.filter(s=>s[3]==='Hadir').length+' orang')}${stat('Terlambat',S.filter(s=>s[3]==='Terlambat').length+' orang')}${stat('Izin',S.filter(s=>s[3]==='Izin').length+' orang')}</div>`+table([['Nama',''],['Posisi',''],['Jam masuk',''],['Status','']],S.map(s=>`<tr><td><b>${s[0]}</b></td><td>${s[1]}</td><td class="mono">${s[2]||'Tidak masuk'}</td><td>${chip(s[3],s[3]==='Hadir'?'ok':s[3]==='Izin'?'nila':'warn')}</td></tr>`),'stack')+SAMPLE};

V['kepatuhan']=()=>{const K=[['TikTok Shop','4,8','1,2%','0,4%','98%','Sehat'],['Shopee','4,9','0,8%','0,3%','99%','Sehat'],['Lazada','4,6','3,1%','1,1%','92%','Perlu perhatian']];
return head('Kesehatan toko','Nilai performa toko di tiap marketplace. Batas aman telat kirim 3%.')+table([['Channel',''],['Rating','n'],['Telat kirim','n'],['Pembatalan','n'],['Chat dibalas','n'],['Status','']],K.map(k=>`<tr><td>${chl(k[0])}</td><td class="n">${k[1]}</td><td class="n">${k[2]}</td><td class="n">${k[3]}</td><td class="n">${k[4]}</td><td>${chip(k[5],k[5]==='Sehat'?'ok':'warn')}</td></tr>`),'stack')+`<div class="panel mt"><h2>Yang perlu dilakukan</h2><p class="sub" style="margin:4px 0 0">Telat kirim Lazada sudah di atas 3%. Dahulukan pickup Lazada sebelum pukul 13.00 sampai angkanya turun.</p></div>`+SAMPLE};

V['expiry']=()=>{const today=new Date();const E=[['Voucher toko 12.12','TikTok Shop',3],['Flash sale daster','Shopee',1],['Akses API Shopee','Sistem',2],['Gratis ongkir XTRA','Shopee',12],['Kontrak kreator afiliasi','TikTok Shop',6],['Promo bundling gamis','Lazada',20]].map(e=>({n:e[0],c:e[1],d:e[2],tgl:new Date(today.getTime()+e[2]*864e5).toLocaleDateString('id-ID',{day:'numeric',month:'short'})})).sort((a,b)=>a.d-b.d);
return head('Jatuh tempo','Voucher, promo, akses toko, dan kontrak yang akan berakhir.')+table([['Item',''],['Channel',''],['Berakhir',''],['Sisa waktu','']],E.map(e=>`<tr><td><b>${e.n}</b></td><td>${CHN.includes(e.c)?chl(e.c):e.c}</td><td>${e.tgl}</td><td>${chip(e.d+' hari',e.d<=3?'bad':e.d<=7?'warn':'ok')}</td></tr>`),'stack')};

V['restock']=()=>{const R=PROD.map((p,i)=>{const s=[8,42,15,60,5,22,11,90][i],j=[6,4,3,2,5,2,2,1][i],d=Math.floor(s/j);return{p,s,j,d,sug:Math.max(0,j*21-s)}}).sort((a,b)=>a.d-b.d);
return head('Restock','Saran jumlah order ulang agar stok cukup untuk 21 hari, berdasarkan rata-rata penjualan harian.')+table([['Produk',''],['Stok','n'],['Terjual per hari','n'],['Cukup untuk','n'],['Saran order','n'],['Prioritas','']],R.map(r=>`<tr><td><b>${r.p}</b></td><td class="n">${r.s}</td><td class="n">${r.j}</td><td class="n">${r.d} hari</td><td class="n"><b>${r.sug} pcs</b></td><td>${chip(r.d<=3?'Segera':r.d<=10?'Minggu ini':'Aman',r.d<=3?'bad':r.d<=10?'warn':'ok')}</td></tr>`),'stack')+SAMPLE};

V['masalah-produk']=()=>{const M=D.get('mp',MP0);
return head('Masalah produk','Catat barang cacat, salah kirim, dan komplain pembeli.')+`<div class="panel" style="margin-bottom:16px"><h2>Laporkan masalah</h2><p class="sub">Laporan baru masuk dengan status Baru</p><form id="mf" class="toolbar" style="margin:0"><select class="field" id="mp1" aria-label="Produk" style="flex:1;min-width:180px">${PROD.map(p=>`<option>${p}</option>`).join('')}</select><input class="field" id="mp2" placeholder="Apa masalahnya?" aria-label="Masalah" style="flex:2;min-width:200px"><select class="field" id="mp3" aria-label="Channel">${CHN.map(c=>`<option>${c}</option>`).join('')}</select><button class="btn pri">Kirim laporan</button></form></div>`+
table([['Produk',''],['Masalah',''],['Channel',''],['Status','']],M.slice().reverse().map(m=>`<tr><td><b>${esc(m.p)}</b></td><td>${esc(m.m)}</td><td>${chl(m.c)}</td><td>${chip(m.s,m.s==='Selesai'?'ok':m.s==='Diproses'?'warn':'mul')}</td></tr>`),'stack')};

V['kalkulator-impor']=()=>`${head('Kalkulator impor','Hitung modal per pcs barang impor sampai tiba di gudang.')}
<div class="grid c2"><div class="panel"><form class="form" id="kf">
<label>Harga per pcs (CNY)<input class="field" type="number" id="k1" value="28" step="0.01" inputmode="decimal"></label>
<label>Kurs 1 CNY dalam rupiah<input class="field" type="number" id="k2" value="2250" inputmode="decimal"></label>
<label>Jumlah pcs<input class="field" type="number" id="k3" value="500" inputmode="numeric"></label>
<label>Ongkir dan jasa impor, total (Rp)<input class="field" type="number" id="k4" value="3500000" inputmode="numeric"></label>
<div class="grid c3" style="gap:10px"><label>Bea masuk %<input class="field" type="number" id="k5" value="25" inputmode="decimal"></label><label>PPN %<input class="field" type="number" id="k6" value="11" inputmode="decimal"></label><label>PPh %<input class="field" type="number" id="k7" value="10" inputmode="decimal"></label></div>
<label>Harga jual per pcs (Rp)<input class="field" type="number" id="k8" value="99000" inputmode="numeric"></label></form></div>
<div class="panel"><div style="color:var(--ink2);font-size:14px">Modal per pcs</div><div class="res" id="kr"></div><div id="kl" style="margin:6px 0 14px;font-weight:700"></div><div class="kv" id="kd"></div><p class="note">Persentase bea masuk dan pajak di sini hanya contoh. Cek tarif sesuai kode HS produkmu ke forwarder atau Bea Cukai.</p></div></div>`;

/* interaksi per halaman */
function bind(id){
  if(id==='ringkasan'){
    $('#refresh').onclick=()=>{$('#synctxt').textContent='Memperbarui';setTimeout(()=>{$('#synctxt').textContent='Tersinkron';toast('Data hari ini sudah diperbarui');render()},600)};
    const tk=$('#ticks'),sc=$('#scale'),sp=$('#spark');
    const drawT=()=>{const W=tk.clientWidth,H=tk.clientHeight,cap=1200,step=W<520?100:50;let g='',s='';for(let v=0;v<=cap;v+=step){const x=v/cap*W,big=v%200===0;g+=`<line x1="${x}" x2="${x}" y1="0" y2="${big?H*.42:H*.22}" stroke="#000" stroke-opacity=".28" stroke-width="1"/>`;if(big&&(W>=520||v%400===0))s+=`<text x="${x}" y="12" font-size="11" font-weight="600" fill="var(--ink3)" text-anchor="${v===0?'start':v===cap?'end':'middle'}">${v}</text>`}tk.innerHTML=g;sc.innerHTML=s};
    const hrs=[2,1,1,0,0,1,4,12,30,48,62,70,58,64,72,66,48,40,36,44,52,30,18,8].slice(0,Math.max(8,new Date().getHours()+1));
    const drawS=()=>{const W=sp.clientWidth,H=sp.clientHeight,mx=Math.max(...hrs),pts=hrs.map((v,i)=>[i/(hrs.length-1)*W,H-2-(v/mx)*(H-6)]);const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');sp.innerHTML=`<path d="${d} L${W} ${H} L0 ${H}Z" fill="var(--nila)" opacity=".1"/><path d="${d}" fill="none" stroke="var(--nila)" stroke-width="2" stroke-linejoin="round"/>`};
    const roT=new ResizeObserver(drawT);roT.observe(tk);const roS=new ResizeObserver(drawS);roS.observe(sp)}
  if(id==='print-daily'){
    $('#pf').oninput=e=>{store.set('pf',e.target.value);const pos=e.target.selectionStart;render();const n=$('#pf');n.focus();n.setSelectionRange(pos,pos)};
    $('#selall').onclick=()=>$$('[data-id]').forEach(c=>c.checked=true);
    $('#doprint').onclick=async()=>{const ids=$$('[data-id]:checked').map(c=>c.dataset.id);if(!ids.length)return toast('Centang pesanan yang mau dicetak dulu');
      const printer='Printer meja 1';
      if(D.on){try{D.c.log.push(await D.kirim('POST',{jenis:'cetak',nomor_pesanan:ids,printer}))}catch(e){return gagal(e)}}
      else{const L=store.get('log',LOG0);L.push({w:new Date().toTimeString().slice(0,5).replace(':','.'),u:window.__first||'Admin',n:ids.length,p:printer});store.set('log',L)}
      ORD.forEach(o=>{if(ids.includes(o.id))o.print=true});if(!D.on)store.set('printed',ORD.filter(o=>o.print).map(o=>o.id));
      toast(ids.length+' label dicetak');drawMenu();render()}}
  if(id==='sdcase')$$('[data-sw]').forEach(b=>b.onclick=async()=>{const k=b.dataset.sw,S={...D.get('sd',SD0)};S[k]=!S[k];
    if(D.on){b.disabled=true;try{D.c.sd=await D.kirim('PUT',{jenis:'aturan',nilai:S})}catch(e){return gagal(e)}finally{b.disabled=false}}else store.set('sd',S);
    b.classList.toggle('on',S[k]);b.setAttribute('aria-checked',S[k]);toast(S[k]?'Aturan dinyalakan':'Aturan dimatikan')});
  if(id==='task'){const T=()=>D.get('task',T0);
    $('#tf').onsubmit=async e=>{e.preventDefault();const v=$('#tin').value.trim();if(!v)return;
      if(D.on){try{D.c.task.unshift(await D.kirim('POST',{jenis:'tugas',judul:v}))}catch(e){return gagal(e)}}else{const t=T();t.unshift({t:v,d:false});store.set('task',t)}
      render();$('#tin').focus()};
    $$('[data-t]').forEach(c=>c.onchange=async()=>{const t=T(),x=t[c.dataset.t];
      if(D.on){try{Object.assign(x,await D.kirim('PATCH',{jenis:'tugas',id:x.id,selesai:c.checked}))}catch(e){c.checked=!c.checked;return gagal(e)}}else{x.d=c.checked;store.set('task',t)}
      render()});
    $$('[data-del]').forEach(b=>b.onclick=async()=>{const t=T(),i=+b.dataset.del;
      if(D.on){try{await D.kirim('DELETE',{jenis:'tugas',id:t[i].id})}catch(e){return gagal(e)}}
      t.splice(i,1);if(!D.on)store.set('task',t);render();toast('Tugas dihapus')})}
  if(id==='rak-produk'){$$('[data-cell]').forEach(b=>b.onclick=()=>{const[r,p,q]=b.dataset.cell.split('|');$('#rinfo').textContent=`Rak ${r} berisi ${p}, sisa ${q} pcs.`});
    $('#rf').oninput=e=>{const v=e.target.value.toLowerCase();$$('[data-cell]').forEach(b=>b.style.opacity=!v||b.dataset.cell.toLowerCase().includes(v)?1:.25)}}
  if(id==='masalah-produk')$('#mf').onsubmit=async e=>{e.preventDefault();const m=$('#mp2').value.trim();if(!m)return toast('Tulis masalahnya dulu');
    const L={p:$('#mp1').value,m,c:$('#mp3').value};
    if(D.on){try{D.c.mp.push(await D.kirim('POST',{jenis:'masalah',produk:L.p,masalah:m,channel:L.c}))}catch(e){return gagal(e)}}
    else{const M=store.get('mp',MP0);M.push({...L,s:'Baru'});store.set('mp',M)}
    toast('Laporan terkirim');render()};
  if(id==='kalkulator-impor'){const calc=()=>{const v=k=>+$('#k'+k).value||0;const barang=v(1)*v(2)*v(3),cif=barang+v(4),bea=cif*v(5)/100,ppn=(cif+bea)*v(6)/100,pph=(cif+bea)*v(7)/100,tot=cif+bea+ppn+pph,per=v(3)?tot/v(3):0,laba=v(8)-per,mg=v(8)?Math.round(laba/v(8)*100):0;
    $('#kr').textContent=rp(per);$('#kl').innerHTML=`<span style="color:${laba>=0?'var(--ok)':'var(--bad)'}">Laba ${rp(laba)} per pcs, margin ${mg}%</span>`;
    $('#kd').innerHTML=[['Harga barang',barang],['Ongkir dan jasa',v(4)],['Bea masuk',bea],['PPN',ppn],['PPh',pph],['Total modal',tot]].map(x=>`<div>${x[0]}<b>${rp(x[1])}</b></div>`).join('')};
    $('#kf').oninput=calc;calc()}
  if(id==='wh-report'){const s=$('#whchart');const inn=[420,380,510,300,460,620,540],out=[610,580,700,640,720,880,904];
    const draw=()=>{const W=s.clientWidth,H=s.clientHeight,pl=40,pb=26,mx=1000,bw=(W-pl)/7,narrow=W<520;let g='';
      [0,250,500,750,1000].forEach(t=>{const y=H-pb-(H-pb-10)*t/mx;g+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--rule)"/>`+(narrow&&t%500?'':`<text x="${pl-8}" y="${y+4}" font-size="11" text-anchor="end" fill="var(--ink3)">${t}</text>`)});
      for(let i=0;i<7;i++){const d=new Date(Date.now()-(6-i)*864e5),x=pl+i*bw+bw*.2,w=bw*.28;[[out[i],'var(--nila)',0],[inn[i],'var(--mulberry)',w+3]].forEach(([v,c,o])=>{const h=(H-pb-10)*v/mx;g+=`<rect x="${x+o}" y="${H-pb-h}" width="${w}" height="${h}" rx="3" fill="${c}"><title>${v} pcs</title></rect>`});g+=`<text x="${pl+i*bw+bw/2}" y="${H-6}" font-size="11" text-anchor="middle" fill="var(--ink3)">${narrow?d.getDate():d.toLocaleDateString('id-ID',{day:'numeric',month:'short'})}</text>`}s.innerHTML=g};
    const ro=new ResizeObserver(draw);ro.observe(s)}
}

/* router */
function render(){
  const id=location.hash.slice(1)||'ringkasan';const page=V[id]?id:'ringkasan';
  $('#app').innerHTML=V[page]();
  $$('#menu a').forEach(a=>{const on=a.dataset.p===page;a.classList.toggle('on',on);on?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current')});
  document.body.classList.remove('nav');bind(page);
  const p=PAGES.find(x=>x[0]===page);document.title=(p?p[1]+' · ':'')+'ichasoraya91';
}

/* palet perintah */
let sel=0;
const palList=q=>{const r=PAGES.filter(p=>(p[1]+' '+p[3]).toLowerCase().includes(q.toLowerCase()));sel=Math.min(sel,Math.max(0,r.length-1));
  $('#pallist').innerHTML=r.map((p,i)=>`<li><a href="#${p[0]}" class="${i===sel?'sel':''}">${svg(p[2])}${p[1]}<small>${p[3]}</small></a></li>`).join('')||'<li class="empty">Menu tidak ditemukan.</li>';return r};
const openPal=()=>{$('#pal').classList.add('open');$('#palin').value='';sel=0;palList('');$('#palin').focus()};
const closePal=()=>$('#pal').classList.remove('open');
$('#openpal').onclick=openPal;
$('#palin').oninput=e=>{sel=0;palList(e.target.value)};
$('#palin').onkeydown=e=>{const r=palList($('#palin').value);if(e.key==='ArrowDown'){sel=Math.min(r.length-1,sel+1);palList($('#palin').value);e.preventDefault()}if(e.key==='ArrowUp'){sel=Math.max(0,sel-1);palList($('#palin').value);e.preventDefault()}if(e.key==='Enter'&&r[sel]){location.hash=r[sel][0];closePal()}if(e.key==='Escape')closePal()};
$('#pal').onclick=e=>{if(e.target.id==='pal'||e.target.closest('a'))closePal()};
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPal()}if(e.key==='Escape'){closePal();$('#memenu').classList.remove('open')}});

/* akun, tema, menu */
const mb=$('#mebtn'),mm=$('#memenu');
mb.onclick=e=>{e.stopPropagation();const o=mm.classList.toggle('open');mb.setAttribute('aria-expanded',o)};
document.addEventListener('click',e=>{if(!e.target.closest('.me'))mm.classList.remove('open')});
const applyTheme=t=>{document.documentElement.dataset.theme=t||'light';const b=document.getElementById('theme');if(b)b.textContent=t==='dark'?'Ganti ke tema terang':'Ganti ke tema gelap'};
applyTheme(store.get('theme','light'));
$('#theme').onclick=()=>{const cur=document.documentElement.dataset.theme||'light';const nx=cur==='dark'?'light':'dark';applyTheme(nx);store.set('theme',nx);render()};
if(store.get('slim',false))document.body.classList.add('slim');
$('#slim').onclick=()=>{const s=document.body.classList.toggle('slim');store.set('slim',s);$('#slim').setAttribute('aria-label',s?'Lebarkan menu':'Ciutkan menu')};
$('#burger').onclick=()=>document.body.classList.toggle('nav');
$('#scrim').onclick=()=>document.body.classList.remove('nav');
window.addEventListener('scroll',()=>$('#top').classList.toggle('scrolled',scrollY>4),{passive:true});
window.addEventListener('hashchange',()=>{render();scrollTo(0,0)});

drawMenu();render();
D.muat().then(ok=>{if(!ok)return;ORD.forEach(o=>o.print=o.print0||D.c.printed.includes(o.id));drawMenu();render()});
fetch('/api/auth/me').then(r=>r.ok?r.json():null).then(u=>{if(!u)return;
  const first=(u.name||u.email.split('@')[0]).split(' ')[0];window.__first=first;
  $('#uname').textContent=first;$('#mname').textContent=u.name||first;$('#memail').textContent=u.email;
  const a=$('#uav');if(u.picture)a.innerHTML=`<img src="${esc(u.picture)}" alt="" referrerpolicy="no-referrer">`;else a.textContent=first[0].toUpperCase();
  if((location.hash.slice(1)||'ringkasan')==='ringkasan')render()}).catch(()=>{});
}
</script>
