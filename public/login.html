<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Masuk · ichasoraya91</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font:15px/1.5 Inter,system-ui,sans-serif;color:#17151c;
background:radial-gradient(circle at 20% 15%,#ffd9e8 0,transparent 45%),radial-gradient(circle at 85% 80%,#e3d9ff 0,transparent 45%),#f8f5fb}
.box{width:100%;max-width:400px;background:#fff;border:1px solid #ece8f1;border-radius:22px;padding:34px 28px;box-shadow:0 20px 50px -20px rgba(90,40,120,.25);text-align:center}
.logo{width:52px;height:52px;border-radius:14px;background:#17151c;color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px;margin:0 auto 14px}
h1{margin:0;font-size:24px}p{margin:6px 0 24px;color:#6d6878}
a.g{display:flex;align-items:center;justify-content:center;gap:10px;min-height:48px;border:1px solid #dadce0;border-radius:12px;text-decoration:none;color:#1f1f1f;font-weight:600;background:#fff}
a.g:hover{background:#f7f7f9}a.g:focus-visible{outline:2px solid #7c5cff;outline-offset:2px}
.err{background:#ffe8e8;color:#c92a2a;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:16px;display:none}
small{display:block;margin-top:18px;color:#8a8494;font-size:12px}
</style>
</head>
<body>
<main class="box">
  <div class="logo">i</div>
  <h1>ichasoraya91</h1>
  <p>Dashboard operasional toko. Masuk dengan akun Google yang sudah didaftarkan.</p>
  <div class="err" id="err"></div>
  <a class="g" href="/api/auth/login">
    <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
    Masuk dengan Google
  </a>
  <small>Hanya email yang terdaftar oleh admin yang bisa masuk.</small>
</main>
<script>
{
  const e = new URLSearchParams(location.search).get('error');
  const msg = { ditolak: 'Email ini belum diizinkan. Minta admin menambahkan emailmu.', state: 'Sesi login kedaluwarsa. Coba lagi.', token: 'Gagal tersambung ke Google. Coba lagi.', profil: 'Gagal membaca profil Google. Coba lagi.' }[e];
  if (msg) { const el = document.getElementById('err'); el.textContent = msg; el.style.display = 'block'; }
}
</script>
</body>
</html>
